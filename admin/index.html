<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17120e">
    <title>AMBERIC AROMA · Управление каталогом</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body>
    <div class="admin-loading" id="admin-loading" role="status" aria-live="polite">
      <div class="admin-loading__mark" aria-hidden="true">A</div>
      <p class="admin-loading__eyebrow">AMBERIC AROMA · ADMIN</p>
      <h1>Управление каталогом</h1>
      <p id="admin-message">Загружаем защищённую панель. Войти смогут только приглашённые пользователи.</p>
      <a class="admin-loading__link" id="admin-setup-link" href="https://decapcms.org/turbo/" target="_blank" rel="noopener noreferrer" hidden>Подключить авторизацию ↗</a>
      <div class="admin-loading__line"><span></span></div>
    </div>
    <script>
      (function () {
        var siteId = 'REPLACE_WITH_DECAP_TURBO_SITE_ID';
        var loading = document.getElementById('admin-loading');
        var message = document.getElementById('admin-message');
        var setupLink = document.getElementById('admin-setup-link');
        var ready = siteId && siteId.indexOf('REPLACE_WITH_') !== 0;
        if (!ready) {
          loading.classList.add('is-setup');
          message.textContent = 'Страница админки готова. Осталось один раз подключить бесплатную авторизацию Decap Turbo — после этого здесь появится вход и редактор ароматов.';
          setupLink.hidden = false;
          return;
        }
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.17.0/dist/decap-cms.js';
        document.body.appendChild(script);
        window.setTimeout(function () { loading.classList.add('is-ready'); }, 800);
      }());
    </script>
  </body>
</html>
